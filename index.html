<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام إدارة النتائج</title>

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container mt-5">

        <h1 class="text-center mb-4">
            نظام إدارة النتائج
        </h1>

        <div class="card p-4">

            <h4 class="mb-3">إضافة طالب جديد</h4>

            <input type="text" id="studentName"
            class="form-control mb-3"
            placeholder="اسم الطالب">

            <input type="number" id="grade1"
            class="form-control mb-3"
            placeholder="درجة المادة الأولى">

            <input type="number" id="grade2"
            class="form-control mb-3"
            placeholder="درجة المادة الثانية">

            <input type="number" id="grade3"
            class="form-control mb-3"
            placeholder="درجة المادة الثالثة">

            <input type="number" id="attendance"
            class="form-control mb-3"
            placeholder="نسبة الحضور">

            <button id="addStudent"
            class="btn btn-primary mb-3">
                إضافة طالب
            </button>

            <button id="mercyBtn"
            class="btn btn-success">
                تفعيل لجنة الرأفة
            </button>

        </div>

        <div id="errorBox" class="mt-3 text-danger"></div>

        <div class="card p-3 mt-4">
            <h4>قائمة الطلاب</h4>
            <div id="studentsDisplay"></div>
        </div>

        <div class="card p-3 mt-4">
            <h4>التقرير النهائي للجنة الرأفة</h4>
            <div id="reportDisplay"></div>
        </div>

    </div>

    <script src="js/main.js"></script>

</body>
</html>
